<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鳴潮ツール</title>
  <meta property="og:title" content="WuWa Tools | 鳴潮 ツール" />
  <meta property="og:description" content="鳴潮(Wuthering Waves)のローテーションシートを作成とマトリクス編成を組めるツールです" />
  <meta property="og:image" content="https://blair0613.github.io/wuwa-rotation-maker/images/ogp-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css?v=202610230002">
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-top">
      <h1>鳴潮ツール</h1>
      <div class="app-tabs">
        <button class="tab-btn active" data-tab="rotation">ローテーション作成</button>
        <button class="tab-btn" data-tab="matrix">マトリクス編成</button>
      </div>
    </div>

    <!-- ローテーションヘッダー -->
    <div class="header-buttons">
      <button id="undoBtn" class="small" title="元に戻す (Ctrl+Z)" disabled>戻る</button>
      <button id="redoBtn" class="small" title="やり直す (Ctrl+Y)" disabled>進む</button>
      <button id="clearBtn" class="danger small">全消去</button>
      <button id="exportBtn" class="primary small">画像保存</button>
      <button id="saveJsonBtn" class="small">JSON保存</button>
      <label id="loadJsonBtn" class="file-label small">
        JSON読込
        <input type="file" id="loadJsonInput" accept=".json" style="display:none;">
      </label>
    </div>

    <!-- マトリクスヘッダー -->
    <div class="header-matrix-buff" id="headerMatrixBuff" style="display: none;">
      <div class="selected-buff-summary">
        <span class="summary-label">クライシス担当：</span>
        <div id="selectedBuffDisplay" class="selected-buff-list"></div>
      </div>
      <button id="openBuffModalBtn" class="primary small">クライシス担当を選択</button>
    </div>
  </header>

  <main>
    <!-- ==================== ローテーション作成画面 ==================== -->
    <div id="rotationView">
      <div class="panel">
        <div class="section-title">
          <h2>ローテーション作成</h2>
        </div>
        
        <div class="preset-container">
          <div class="preset-group">
            <input type="text" id="presetNameInput" class="form-input" placeholder="プリセット名を入力">
            <button id="savePresetBtn" class="small primary">保存</button>
          </div>
          <div class="preset-group">
            <select id="presetSelect" class="form-select">
              <option value="">保存したプリセットを選択...</option>
            </select>
            <button id="loadPresetBtn" class="small">呼出</button>
            <button id="deletePresetBtn" class="small danger">削除</button>
          </div>
        </div>

        <div class="add-row">
          <div>
            <label>キャラクター選択</label>
            <div id="characterList" class="character-list"></div>
          </div>
          <div>
            <label>アクション選択</label>
            <div id="skillList" class="skill-list"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">
          <h2>アクション編集</h2>
          <div class="preview-controls">
            <button id="editOpeningBtn" class="small primary">開幕ローテを編集する</button>
            <button id="editLoopBtn" class="small">ループローテを編集する</button>
          </div>
        </div>

        <div style="margin-top: 15px;">
          <div class="title-with-input">
            <label class="time-label">タイトル:</label>
            <input type="text" id="titleInput" class="form-input" value="開幕ローテ" style="max-width: 300px;">
          </div>
        </div>

        <div style="margin-top: 15px;">
          <label>【開幕ローテーション】</label>
          <div class="title-with-input" style="margin-bottom: 8px;">
            <label class="time-label">想定秒数 (s):</label>
            <input type="number" id="openingTimeInput" class="time-input" placeholder="例: 20">
          </div>
          <div id="openingEditor" class="editor"></div>
        </div>

        <div style="margin-top: 20px;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
            <label style="margin: 0;">【ループローテーション】</label>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;">
              <input type="checkbox" id="showLoop" checked> ループローテを表示する
            </label>
          </div>
          <div class="title-with-input" style="margin-bottom: 8px;">
            <label class="time-label">想定秒数 (s):</label>
            <input type="number" id="loopTimeInput" class="time-input" placeholder="例: 25">
          </div>
          <div id="loopEditor" class="editor"></div>
        </div>
      </div>

      <div class="panel">
        <div class="section-title">
          <h2>プレビュー</h2>
        </div>
        <div class="preview-wrap">
          <canvas id="previewCanvas" width="1600" height="600"></canvas>
        </div>
      </div>
    </div>

    <!-- ==================== マトリクス編成画面 ==================== -->
    <div id="matrixView" style="display: none;">
      <div class="matrix-layout">
        <!-- 左カラム：キャラクター選択 -->
        <div class="panel matrix-sticky-panel">
          <div class="section-title">
            <h2>キャラクター選択</h2>
          </div>
          <p class="hint">編成スロットを選択してタップ配置<br><b>[右クリック]</b> で未所持切替</p>
          
          <div id="matrixElementFilter" class="element-filter" style="margin-top: 10px;"></div>
          <div id="matrixCharacterList" class="matrix-character-grid"></div>
        </div>

        <!-- 右カラム：パーティ編成一覧 -->
        <div class="panel">
          <div class="section-title">
            <h2>マトリクスパーティ編成一覧</h2>
            <button id="addMatrixTeamBtn" class="primary small">チームを追加</button>
          </div>

          <div id="matrixTeamsContainer" class="matrix-teams-container"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- クライシス担当選択 -->
  <div id="buffModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>今期のクライシス担当を選択 (初期疲労度+1)</h3>
        <button id="closeBuffModalBtn" class="modal-close-btn">×</button>
      </div>
      <div class="modal-body">
        <p class="hint" style="margin-top: 0; margin-bottom: 12px;">今期のクライシス担当を選択してください。選択したキャラは初期疲労度が +1 になります</p>
        <div id="matrixBuffCharList" class="buff-char-list"></div>
      </div>
      <div class="modal-footer">
        <button id="saveBuffModalBtn" class="primary">完了</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
