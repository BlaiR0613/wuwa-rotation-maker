<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>鳴潮 ローテーション作成ツール</title>
  <meta property="og:title" content="WuWa Rotation Maker | 鳴潮 ローテーション作成ツール" />
  <meta property="og:description" content="鳴潮(Wuthering Waves)のローテーションシートを作成できるツールです。" />
  <meta property="og:image" content="https://blair0613.github.io/wuwa-rotation-maker/images/ogp-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css?v=202608301558">
</head>
<body>
<header>
  <h1>鳴潮 ローテーション作成ツール</h1>
  <div class="header-buttons">
    <button id="clearBtn" class="danger">全消去</button>
    <button id="exportBtn" class="primary">PNGとして保存</button>
    <button id="saveJsonBtn" class="btn header-btn">JSONファイルで保存</button>
    <label id="loadJsonBtn" class="btn header-btn file-label">
      JSONファイルを読み込む
      <input type="file" id="loadJsonInput" accept=".json" style="display: none;">
    </label>
  </div>
</header>

<main>
  <!-- プリセット保存・呼び出しパネル -->
  <section class="panel">
    <h2>プリセット管理</h2>
    <div class="preset-container">
      <!-- 保存エリア -->
      <div class="preset-group">
        <input type="text" id="presetNameInput" placeholder="プリセット名（例: 今汐ローテ）" class="form-input">
        <button id="savePresetBtn" class="btn">保存</button>
      </div>

      <!-- 呼び出し・削除エリア -->
      <div class="preset-group">
        <select id="presetSelect" class="form-select">
          <option value="">保存したプリセットを選択...</option>
        </select>
        <button id="loadPresetBtn" class="btn primary">呼び出し</button>
        <button id="deletePresetBtn" class="btn danger">削除</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>アクションを追加</h2>
    <div class="add-row">
      <div>
        <label>キャラクター</label>
        <div id="characterList" class="character-list"></div>
      </div>
      <div>
        <label>モーション</label>
        <div id="skillList" class="skill-list"></div>
      </div>
    </div>
    <p class="hint">同じキャラクターが連続している場合は、自動的に1つのキャラクター欄へまとめます。</p>
  </section>

  <section class="panel">
    <div class="section-title">
      <div class="title-with-input">
        <h2>開幕ローテ</h2>
        <label class="time-label">
          <input id="openingTimeInput" type="number" step="0.1" min="0" placeholder="秒数" class="time-input"> s
        </label>
      </div>
      <button class="small" id="editOpeningBtn">開幕ローテを編集する</button>
    </div>
    <div id="openingEditor" class="editor"></div>
  </section>

  <section class="panel">
    <div class="section-title">
      <div class="title-with-input">
        <h2>ループローテ</h2>
        <label class="time-label">
          <input id="loopTimeInput" type="number" step="0.1" min="0" placeholder="秒数" class="time-input"> s
        </label>
      </div>
      <button class="small" id="editLoopBtn">ループローテを編集する</button>
    </div>
    <div id="loopEditor" class="editor"></div>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>プレビュー</h2>
      <div class="preview-controls">
        <label>タイトル <input id="titleInput" value="開幕ローテ"></label>
        <label>ループ表示<input id="showLoop" type="checkbox" checked></label>
      </div>
    </div>
    <div class="preview-wrap">
      <canvas id="previewCanvas" width="1600" height="760"></canvas>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
